<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) — Google Ads (AW-18393777489). Conversions are
         reported in-app on a completed booking; see src/lib/gtag.js. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18393777489"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18393777489');
    </script>
    <!-- Kiosk stability: lock the zoom. Without maximum-scale/user-scalable,
         iOS Safari auto-zooms into any tapped control and never zooms back out,
         and a stray pinch stays stuck — so the tablet ends up zoomed and the
         layout no longer fits. Locking scale keeps the fixed one-screen layout
         rock-steady (this is a fixed-layout booking kiosk, not a scroll page). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari only drops the browser URL/navigation bar (launches
         full-screen from the home screen) when it sees THIS apple- tag; the
         generic mobile-web-app-capable above only covers Android and iOS 16.4+.
         status-bar-style "black" = dark bar + white text, matching the dark
         entry screens; content sits below it (opaque, no overlap). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RoverZoom" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>RoverZoom — Book a scheduled ride</title>

    <!-- The app renders entirely in JavaScript, so without these the served
         HTML says almost nothing about the business. Human reviewers see the
         rendered page, but automated checks — A2P vetting, link previews,
         search crawlers — read only this. -->
    <meta
      name="description"
      content="RoverZoom books scheduled rides across Palm Beach County, Florida — airport runs, medical appointments and work commutes, with the price locked at booking and a driver assigned in advance. A service of Bibior, Inc."
    />
    <link rel="canonical" href="https://www.roverzoom.com/" />
    <meta property="og:site_name" content="RoverZoom" />
    <meta property="og:title" content="RoverZoom — Book a scheduled ride" />
    <meta property="og:description" content="Scheduled rides across Palm Beach County, Florida. Your price is locked at booking. A service of Bibior, Inc." />
    <meta property="og:url" content="https://www.roverzoom.com/" />
    <meta property="og:type" content="website" />

    <!-- Structured data. Tells Google this is a local transport service, where
         it operates, and what it offers — none of which is derivable from a
         JavaScript-rendered page. Deliberately contains no aggregateRating:
         inventing review data is a manual-action penalty, not a shortcut. -->
    <script type="application/ld+json">
{
          "@context": "https://schema.org",
          "@type": "LocalBusiness",
          "additionalType": "https://schema.org/TaxiService",
          "@id": "https://www.roverzoom.com/#business",
          "name": "RoverZoom",
          "legalName": "Bibior, Inc.",
          "url": "https://www.roverzoom.com",
          "description": "Scheduled ride bookings across South Florida. Book in advance, your price is locked at booking, and a driver is assigned before your pickup time.",
          "telephone": "+1-561-513-3513",
          "email": "support@roverzoom.com",
          "priceRange": "$$",
          "logo": "https://www.roverzoom.com/logo-wordmark.png",
          "image": "https://www.roverzoom.com/logo-email.png",
          "areaServed": [
                {
                      "@type": "State",
                      "name": "Florida"
                },
                {
                      "@type": "AdministrativeArea",
                      "name": "Palm Beach County"
                },
                {
                      "@type": "City",
                      "name": "West Palm Beach"
                },
                {
                      "@type": "City",
                      "name": "Boca Raton"
                },
                {
                      "@type": "City",
                      "name": "Delray Beach"
                },
                {
                      "@type": "City",
                      "name": "Boynton Beach"
                },
                {
                      "@type": "City",
                      "name": "Wellington"
                },
                {
                      "@type": "City",
                      "name": "Jupiter"
                },
                {
                      "@type": "City",
                      "name": "Palm Beach Gardens"
                },
                {
                      "@type": "City",
                      "name": "Lake Worth"
                }
          ],
          "serviceArea": {
                "@type": "GeoCircle",
                "geoMidpoint": {
                      "@type": "GeoCoordinates",
                      "latitude": 26.7153,
                      "longitude": -80.0534
                },
                "geoRadius": "120000"
          },
          "hasOfferCatalog": {
                "@type": "OfferCatalog",
                "name": "Scheduled rides",
                "itemListElement": [
                      {
                            "@type": "Offer",
                            "itemOffered": {
                                  "@type": "Service",
                                  "name": "Airport rides",
                                  "description": "Pre-booked rides to and from Palm Beach International, Fort Lauderdale and Miami airports."
                            }
                      },
                      {
                            "@type": "Offer",
                            "itemOffered": {
                                  "@type": "Service",
                                  "name": "Medical appointment rides",
                                  "description": "Scheduled transport to and from medical appointments, procedures and treatments."
                            }
                      },
                      {
                            "@type": "Offer",
                            "itemOffered": {
                                  "@type": "Service",
                                  "name": "Work commute",
                                  "description": "A driver booked in advance for a recurring commute."
                            }
                      }
                ]
          },
          "sameAs": [
                "https://bibior.com"
          ]
    }
    </script>
    <!-- Tell search engines the real home is roverzoom.com, not the raw
         *.vercel.app deployment URL, so that's what gets indexed/surfaced. -->
    <link rel="canonical" href="https://www.roverzoom.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Set theme BEFORE React renders to prevent white flash -->
    <script>
      (function(){
        var t = localStorage.getItem('rz-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <div id="root"></div>

    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:0 24px;font-family:'Inter',-apple-system,sans-serif;line-height:1.6;color:#3f3f46">
        <h1 style="color:#111113">RoverZoom</h1>
        <p>
          RoverZoom books scheduled rides across Palm Beach County, Florida — airport
          runs, medical appointments, and work commutes. Your price is locked when you
          book, a driver is assigned in advance, and there is no surge pricing.
        </p>
        <p>
          Booking requires JavaScript. Please enable it, or call us to book by phone.
        </p>
        <p>
          <strong>RoverZoom is a service of Bibior, Inc.</strong><br />
          <a href="/privacy">Privacy Policy</a> &middot;
          <a href="/terms">Terms of Service</a> &middot;
          <a href="mailto:support@roverzoom.com">support@roverzoom.com</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
